<meta name="claude:viewport-fit-sides" content="cover">
<title>Live Interativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
<style>
  /* Layout: palco do overlay (escuro, sempre) em cima; mesa de testes com botões embaixo.
     Tokens com prefixo --d- para não colidir com os do overlay.css. */
  :root {
    --d-bg: #eceef3;
    --d-surface: #ffffff;
    --d-ink: #13151c;
    --d-mute: #596074;
    --d-line: #d3d7e0;
    --d-accent: #d4204a;
    --d-accent-ink: #ffffff;
    --d-focus: #0a7d78;
    --d-font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
    --d-font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --d-bg: #0b0d13; --d-surface: #151822; --d-ink: #eceff6; --d-mute: #99a1b5;
      --d-line: #2a2f3e; --d-accent: #ff5278; --d-accent-ink: #1a0509; --d-focus: #3fd6cf;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --d-bg: #0b0d13; --d-surface: #151822; --d-ink: #eceff6; --d-mute: #99a1b5;
    --d-line: #2a2f3e; --d-accent: #ff5278; --d-accent-ink: #1a0509; --d-focus: #3fd6cf;
    color-scheme: dark;
  }

  html, body { width: auto; height: auto; overflow: visible; background: var(--d-bg); color: var(--d-ink); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font: 16px/1.45 var(--d-font-body);
  }

  .topo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap;
    padding: 14px max(16px, env(safe-area-inset-left, 0px)) 12px max(16px, env(safe-area-inset-right, 0px)); }
  .topo h1 { font: 700 22px/1.2 var(--d-font-display); margin: 0; }
  .topo p { margin: 0; color: var(--d-mute); font-size: 14px; }

  /* O overlay desenha em cima de um "vídeo" escuro; no OBS o fundo é transparente. */
  .palco-demo {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    flex: none;
    height: 52vh;
    min-height: 320px;
    overflow: hidden;
    background: repeating-conic-gradient(#171a24 0% 25%, #1e222e 0% 50%) 0 0 / 40px 40px;
    color: #fff;
  }
  .palco-demo #palco { position: absolute; }
  .dica {
    position: absolute; inset: auto 16px 16px 16px; margin: 0; text-align: center;
    color: #c9cfdd; font-size: 15px; pointer-events: none;
  }

  .mesa { padding: 16px max(16px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
  .mesa-topo { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: end; }
  .campo { display: grid; gap: 4px; font-size: 13px; color: var(--d-mute); }
  .campo input { min-width: 0; width: 200px; max-width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--d-line);
    background: var(--d-surface); color: var(--d-ink); font: inherit; }
  .grupo { display: grid; gap: 8px; }
  .grupo h2 { margin: 0; font: 600 12px/1.3 var(--d-font-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--d-mute); }
  .botoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  button {
    text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--d-line);
    background: var(--d-surface); color: var(--d-ink); font: 600 15px/1.3 var(--d-font-body); cursor: pointer;
  }
  button small { display: block; font-weight: 400; font-size: 13px; color: var(--d-mute); }
  button:hover { border-color: var(--d-accent); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--d-focus); outline-offset: 2px; }
  button.fraco { background: transparent; color: var(--d-mute); font-weight: 500; }

  @media (max-width: 760px) {
    .palco-demo #meta { top: 12px; width: calc(100% - 24px); padding: 8px 12px 10px; }
    .palco-demo .meta-topo { font-size: 15px; margin-bottom: 6px; }
    .palco-demo #ranking { top: 82px; right: 12px; min-width: 0; padding: 8px 12px; }
    .palco-demo #ranking li { font-size: 15px; }
    .palco-demo #ranking li span:first-child { max-width: 110px; }
    .palco-demo .aviso { font-size: 20px; padding: 10px 18px 10px 10px; gap: 10px; }
    .palco-demo .aviso .icone { font-size: 28px; }
    .palco-demo #bau-cena { background: rgba(6, 8, 14, 0.82); }
    .palco-demo .bau-wrap { width: 220px; height: 187px; margin-top: 2vh; }
    .palco-demo .bau-titulo { font-size: 26px; padding: 0 12px; }
    .palco-demo .premio { font-size: 22px; padding: 14px 18px; max-width: calc(100vw - 32px); }
  }
</style>

<header class="topo">
  <h1>Live interativa</h1>
  <p>Simulação no navegador. Nada aqui se conecta ao TikTok nem envia presente.</p>
</header>

<section class="palco-demo" aria-label="Pré-visualização do overlay">
  <div id="palco">
    <header id="meta" hidden>
      <div class="meta-topo"><span id="meta-texto"></span><span id="meta-valor"></span></div>
      <div class="barra"><div id="meta-barra"></div></div>
    </header>
    <aside id="ranking" hidden>
      <h2>Top doadores</h2>
      <ol id="ranking-lista"></ol>
    </aside>
    <div id="avisos"></div>
    <div id="bau-cena" hidden></div>
  </div>
  <p class="dica" id="dica">Escolha um presente na mesa de testes abaixo. Ative o som do navegador para ouvir os efeitos.</p>
</section>
<canvas id="particulas"></canvas>

<section class="mesa" aria-label="Mesa de testes">
  <div class="mesa-topo">
    <label class="campo" for="sim-nome">Quem manda o presente
      <input id="sim-nome" value="Maria" maxlength="30" autocomplete="off">
    </label>
    <button type="button" class="fraco" id="zerar">Zerar meta e ranking</button>
  </div>

  <div class="grupo">
    <h2>Regra por nome do presente</h2>
    <div class="botoes">
      <button type="button" data-presente="Rose" data-diamantes="1">Rosa<small>chuva de corações · 1 💎</small></button>
      <button type="button" data-presente="Doughnut" data-diamantes="30">Doughnut<small>chuva de rosquinhas · 30 💎</small></button>
      <button type="button" data-presente="GG" data-diamantes="1">GG<small>a tela treme · 1 💎</small></button>
    </div>
  </div>

  <div class="grupo">
    <h2>Regra por valor em diamantes</h2>
    <div class="botoes">
      <button type="button" data-presente="Presente pequeno" data-diamantes="5">5 💎<small>confete</small></button>
      <button type="button" data-presente="Presente médio" data-diamantes="25">25 💎<small>fogos de artifício</small></button>
      <button type="button" data-presente="Presente de 99" data-diamantes="99">99 💎<small>baú comum</small></button>
      <button type="button" data-presente="Presente de 250" data-diamantes="250">250 💎<small>baú raro</small></button>
      <button type="button" data-presente="Presente de 500" data-diamantes="500">500 💎<small>baú épico</small></button>
      <button type="button" data-presente="Presente de 1500" data-diamantes="1500">1500 💎<small>baú lendário</small></button>
    </div>
  </div>

  <div class="grupo">
    <h2>Reações sem custo</h2>
    <div class="botoes">
      <button type="button" data-evento="seguidor">Novo seguidor<small>confete</small></button>
      <button type="button" data-evento="compartilhou">Compartilhou a live<small>corações</small></button>
    </div>
  </div>
</section>

<script type="module" src="demo.js"></script>
